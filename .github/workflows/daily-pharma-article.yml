name: Daily Pharma Article

on:
  schedule:
    - cron: '0 7 * * 1-5' # Mon-Fri, 07:00 UTC (09:00 RO)
  workflow_dispatch: {} # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "WebSEM Bot"
          git config user.email "bot@websem.ro"

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/generate-article.ts
